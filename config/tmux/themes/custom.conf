# Colors
source-file -q ~/.config/tmux/themes/colors.conf

WINDOW_LEFT_SEP=" "
WINDOW_RIGHT_SEP=""
# WINDOW_LEFT_SEP=""
# WINDOW_RIGHT_SEP=""
WINDOW_SEP=""

STATUS_LEFT_SEP=""
STATUS_RIGHT_SEP=""

# Styling
set -g status-interval 3
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#7aa2f7"

set -g window-status-style "none"
set -g window-status-current-style "none"
set -g window-status-last-style "none"
set -g window-status-activity-style "none"
set -g window-status-bell-style "none"

set -g window-status-format "#[fg=$WINDOW_BG,bg=$BG_COLOR]$WINDOW_LEFT_SEP#[fg=$WINDOW_FG,bg=$WINDOW_BG] #I:#(basename #{pane_current_path})#{?window_zoomed_flag, 󰁌,} #[fg=$INDICATOR_INACTIVE_BG,bg=$INDICATOR_INACTIVE_BG]  #[fg=$INDICATOR_INACTIVE_BG,bg=$BG_COLOR]$WINDOW_RIGHT_SEP"
set -g window-status-current-format "#[fg=$WINDOW_BG,bg=$BG_COLOR]$WINDOW_LEFT_SEP#[fg=$WINDOW_ACTIVE_FG,bg=$WINDOW_BG,bold] #I:#(basename #{pane_current_path})#{?window_zoomed_flag, 󰁌,} #[fg=$INDICATOR_ACTIVE_BG,bg=$INDICATOR_ACTIVE_BG,nobold]  #[fg=$INDICATOR_ACTIVE_BG,bg=$BG_COLOR]$WINDOW_RIGHT_SEP"

set -g window-status-separator "$WINDOW_SEP"

set -g status-left ""

set -g status-right "\
#[fg=$APP_BG,bg=$BG_COLOR]$STATUS_LEFT_SEP#[fg=$APP_FG,bg=$APP_BG,bold] #{pane_current_command} #[fg=$APP_BG,bg=$BG_COLOR]$STATUS_RIGHT_SEP \
#{?client_prefix,#[fg=$SESSION_PREFIX_BG#,bg=$BG_COLOR]$STATUS_LEFT_SEP#[fg=$SESSION_PREFIX_FG#,bg=$SESSION_PREFIX_BG]#[bold] #S #[fg=$SESSION_PREFIX_BG#,bg=$BG_COLOR]$STATUS_RIGHT_SEP,#[fg=$SESSION_BG#,bg=$BG_COLOR]$STATUS_LEFT_SEP#[fg=$SESSION_FG#,bg=$SESSION_BG]#[bold] #S #[fg=$SESSION_BG#,bg=$BG_COLOR]$STATUS_RIGHT_SEP}"
