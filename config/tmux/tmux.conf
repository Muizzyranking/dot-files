set -sg escape-time 50
set-option -g default-shell /bin/zsh
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
setw -g mode-keys vi
setw -g automatic-rename on

# change prefix to C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Set true colors
set -g default-terminal "tmux-256color"
set -sa terminal-features ",xterm*:RGB,xterm-kitty:RGB"

set-option -g xterm-keys on
set-window-option -g xterm-keys on
# set -g extended-keys on

# allow c-cr in nvim
bind-key -n C-Enter send-keys Escape "[13;5u"

#move status bar to top
set -g status-position top

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g display-panes-time 4000

#prefix r to reload tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf"

# ---------------------------------------------------------------------------
# Windows and panes
# ---------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Kill
bind x kill-pane
bind X kill-window
bind o kill-window -a

# Vim-like pane switching and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt shortcuts
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-o resize-pane -Z
bind -n M-H swap-pane -s '{left-of}'
bind -n M-J swap-pane -s '{down-of}'
bind -n M-K swap-pane -s '{up-of}'
bind -n M-L swap-pane -s '{right-of}'

# Layout: one big pane on top, two small ones below (keeps your directory)
bind T kill-pane -a \; split-window -v -c "#{pane_current_path}" \; resize-pane -y 15 \; split-window -h -c "#{pane_current_path}" \; select-pane -t 1

bind -n M-l send-keys C-l \; run 'sleep 0.2' \; clear-history

bind b break-pane -d
bind w choose-tree -Zw
bind e choose-tree -Zs
bind C-p select-window -l
bind C-b set-option -g status

# prefix 1..9 selects the window, or creates it if missing. 0 = window 10.
bind 1 if 'tmux select-window -t :1'  '' "new-window -t :1  -c '#{pane_current_path}'"
bind 2 if 'tmux select-window -t :2'  '' "new-window -t :2  -c '#{pane_current_path}'"
bind 3 if 'tmux select-window -t :3'  '' "new-window -t :3  -c '#{pane_current_path}'"
bind 4 if 'tmux select-window -t :4'  '' "new-window -t :4  -c '#{pane_current_path}'"
bind 5 if 'tmux select-window -t :5'  '' "new-window -t :5  -c '#{pane_current_path}'"
bind 6 if 'tmux select-window -t :6'  '' "new-window -t :6  -c '#{pane_current_path}'"
bind 7 if 'tmux select-window -t :7'  '' "new-window -t :7  -c '#{pane_current_path}'"
bind 8 if 'tmux select-window -t :8'  '' "new-window -t :8  -c '#{pane_current_path}'"
bind 9 if 'tmux select-window -t :9'  '' "new-window -t :9  -c '#{pane_current_path}'"
bind 0 if 'tmux select-window -t :10' '' "new-window -t :10 -c '#{pane_current_path}'"

bind S setw synchronize-panes \; display-message "sync panes: #{?pane_synchronized,ON,OFF}"

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel clipcopy

# Don't leave copy mode when a mouse drag ends
unbind -T copy-mode-vi MouseDragEnd1Pane

# Clear screen and scrollback (prefix C-l). Plain C-l is left to vim-tmux-navigator.
bind C-l send-keys C-l \; clear-history

# Paste from the system clipboard with prefix ]
if-shell 'command -v wl-paste >/dev/null' {
    bind ] run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"
} {
    if-shell 'command -v xclip >/dev/null' {
        bind ] run "xclip -out -selection clipboard | tmux load-buffer - && tmux paste-buffer"
    } {
        display-message "No clipboard utility available for paste"
    }
}

source-file ~/.config/tmux/themes/custom.conf

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# sessionx
set -g @sessionx-bind 's'
set -g @sessionx-bind-kill-session 'alt-x'
set -g @sessionx-filter-current 'true'
set -g @sessionx-ls-command 'eza --tree --group-directories-first --color=always --icons=always'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-window-mode 'off'
set -g @sessionx-layout 'reverse'

# resurrect + continuum (continuum must load after the theme sets status-right)
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'
