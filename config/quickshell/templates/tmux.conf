# Generated by the shell from the palette "{{name}}". Edits are overwritten.
# The colours are tmux user options (set -g @NAME) and custom.conf reads them as
# #{@NAME}: formats expand at draw time, so one source-file always shows the
# current palette. (tmux >= 3.4 expands $vars in a config file before a nested
# source-file runs, so shell-style assignments were always one reload behind.)

set -g @BG_COLOR "default"
set -g @WINDOW_BG "{{surfaceHi}}"
set -g @WINDOW_FG "{{fgDim}}"
set -g @WINDOW_ACTIVE_FG "{{fg}}"
set -g @INDICATOR_INACTIVE_BG "{{contrast}}"
set -g @INDICATOR_ACTIVE_BG "{{accent}}"
set -g @APP_BG "{{cyan}}"
set -g @APP_FG "{{bg}}"
set -g @SESSION_BG "{{warm}}"
set -g @SESSION_FG "{{bg}}"
set -g @SESSION_PREFIX_BG "{{bad}}"
set -g @SESSION_PREFIX_FG "{{bg}}"
set -g @SURFACE_HI "{{surfaceHi}}"
set -g @ACCENT "{{accent}}"

set -g status-style "bg=default,fg={{fg}}"
set -g pane-border-style "fg={{surfaceHi}}"
set -g pane-active-border-style "fg={{accent}}"
set -g message-style "bg=default,fg={{fg}},bold"
set -g message-command-style "bg=default,fg={{fg}},bold"
set -g mode-style "bg={{accent}},fg={{onAccent}}"

# fzf inside tmux (sessionx and friends) inherits the server environment, which is
# frozen at server start; this updates it together with the palette, so the next
# popup picks up the colours without restarting the tmux server.
set-environment -g FZF_DEFAULT_OPTS "--color=fg:{{fg}},bg:{{bg}},hl:{{purple}} --color=fg+:{{fgBright}},bg+:{{surface}},hl+:{{cyan}} --color=info:{{info}},prompt:{{bad}},pointer:{{purple}} --color=marker:{{good}},spinner:{{purple}},header:{{info}} --color=border:{{surfaceHi}},label:{{info}},query:{{fgBright}} --border=rounded --prompt='🔍 ' --pointer='▶' --marker='✓'"
