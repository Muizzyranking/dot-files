# Generated by the shell from the palette "{{name}}". Edits are overwritten.
# In tmux.conf add:  source-file ~/.config/tmux/tmux/colors.conf  (before the formats)

BG_COLOR="default"

WINDOW_BG="{{surfaceHi}}"
WINDOW_FG="{{fgDim}}"
WINDOW_ACTIVE_FG="{{fg}}"

INDICATOR_INACTIVE_BG="{{contrast}}"
INDICATOR_ACTIVE_BG="{{accent}}"

APP_BG="{{cyan}}"
APP_FG="{{bg}}"

SESSION_BG="{{warm}}"
SESSION_FG="{{bg}}"

SESSION_PREFIX_BG="{{bad}}"
SESSION_PREFIX_FG="{{bg}}"

set -g status-style "bg=$BG_COLOR,fg={{fg}}"
set -g pane-border-style "fg={{surfaceHi}}"
set -g pane-active-border-style "fg={{accent}}"
set -g message-style "bg=$BG_COLOR,fg={{fg}},bold"
set -g message-command-style "bg=$BG_COLOR,fg={{fg}},bold"
set -g mode-style "bg={{accent}},fg={{onAccent}}"
