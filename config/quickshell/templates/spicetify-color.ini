; Generated by the shell from the palette "{{name}}" ({{mode}}). Edits are overwritten.
; Spicetify colour scheme. Keys are the standard set (see the SpicetifyDefault theme);
; extras/spicetify-reload.sh pushes these into the running client as --spice-* variables.
[qs-shell]
text               = {{fg}}
subtext            = {{fgDim}}
main               = {{bg}}
main-elevated      = {{surface}}
highlight          = {{surfaceHi}}
highlight-elevated = {{surface}}
sidebar            = {{panel}}
player             = {{panel}}
card               = {{surface}}
shadow             = {{island}}
selected-row       = {{surfaceHi}}
button             = {{accent}}
button-active      = {{accent}}
button-disabled    = {{surfaceHi}}
tab-active         = {{surface}}
notification       = {{accent}}
notification-error = {{bad}}
misc               = {{fgFaint}}
